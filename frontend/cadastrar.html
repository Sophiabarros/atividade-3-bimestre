<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cadastrar filme</title>
</head>
<body data-pagina="cadastrar">
    <header class="topo coluna estreita">
        <a class="voltar" href="../index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            Voltar para a lista
        </a>
        <h1 id="titulo-pagina">Cadastrar filme</h1>
    </header>

    <main class="coluna estreita">
        <form class="claquete claquete-form nota-nd" id="formulario" aria-labelledby="titulo-pagina">
            <div class="barras" aria-hidden="true"><span></span><span></span></div>
            <div class="claquete-corpo">
                <div class="celulas">
                    <div class="celula celula-larga campo">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" name="titulo" required autocomplete="off">
                    </div>

                    <div class="celula campo">
                        <label for="genero">Gênero</label>
                        <input type="text" id="genero" name="genero" required autocomplete="off">
                    </div>

                    <div class="celula campo">
                        <label for="duracao">Duração</label>
                        <input type="text" id="duracao" name="duracao" placeholder="Ex.: 120 minutos" required autocomplete="off">
                    </div>

                    <div class="celula campo">
                        <label for="classificacao">Classificação indicativa</label>
                        <input type="number" id="classificacao" name="classificacao" min="0" step="1" inputmode="numeric" required aria-describedby="ajuda-classificacao">
                        <p class="ajuda" id="ajuda-classificacao">Idade mínima em anos. Use 0 para livre.</p>
                    </div>
                </div>

                <div class="formulario-acoes">
                    <button type="submit" class="botao-principal" id="botao-salvar">Cadastrar filme</button>
                    <a class="botao-texto" href="../index.html">Cancelar</a>
                </div>
            </div>
        </form>
    </main>

    <p class="aviso" id="aviso" role="status" aria-live="polite"></p>

    <script src="comum.js"></script>
    <script src="formulario.js"></script>
</body>
</html>
